<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Clock face in the app's panel colour with a gold rim -->
  <circle cx="32" cy="32" r="28" fill="#2A2A2A" stroke="#C5A059" stroke-width="6"/>
  <!-- Hour marks at 12, 3, 6 and 9 -->
  <g stroke="#C5A059" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="11" x2="32" y2="16"/>
    <line x1="53" y1="32" x2="48" y2="32"/>
    <line x1="32" y1="53" x2="32" y2="48"/>
    <line x1="11" y1="32" x2="16" y2="32"/>
  </g>
  <!-- Hands at 10:10 -->
  <g stroke="#E5E5E5" stroke-linecap="round">
    <line x1="32" y1="32" x2="22" y2="25" stroke-width="5"/>
    <line x1="32" y1="32" x2="43" y2="18" stroke-width="4"/>
  </g>
  <circle cx="32" cy="32" r="4" fill="#C5A059"/>
</svg>
